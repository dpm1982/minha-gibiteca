<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Gibiteca PWA</title>
    
    <!-- Meta tags para PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111827">

    <!-- Configuração PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">

    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <!-- APIs do Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <style>
        body {
            overscroll-behavior-y: none;
            background-color: #111827;
            color: #f3f4f6;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }

        #reader-container { touch-action: none; overflow: hidden; }
        #comic-page { transition: transform 0.1s ease-out; transform-origin: center center; will-change: transform; }

        .hide { display: none !important; }

        /* 
         * MODELO 3 COLUNAS x 3 LINHAS (PRATELEIRA)
         * Garante sempre 3 colunas e impede o achatamento vertical dos cards
         */
        .shelf-grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-auto-rows: max-content;
            gap: 12px;
            width: 100%;
            max-width: clamp(340px, calc(65vh - 110px), 680px);
            margin: 0 auto;
            align-content: start;
        }

        .comic-card {
            display: flex;
            flex-direction: column;
            background-color: #1f2937;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            position: relative;
            height: auto;
            min-height: max-content;
            border: 1px solid #374151;
            transition: transform 0.15s ease-in-out;
        }

        .comic-card:hover {
            transform: scale(1.02);
        }

        /* Caixa da capa em proporção estritamente vertical (2:3) */
        .comic-cover-box {
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #111827;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .comic-cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Rodapé fixo do card: Nome da revista + Barra de Progresso sempre visíveis */
        .comic-meta-box {
            padding: 6px 8px;
            background-color: #1f2937;
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 52px;
            min-height: 52px;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="fixed inset-0 flex flex-col font-sans overflow-hidden">

    <!-- CAIXA DE MENSAGEM -->
    <div id="message-box" class="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center hide">
        <div class="bg-gray-800 p-6 rounded-lg max-w-sm w-full mx-4 shadow-xl border border-gray-700">
            <h3 class="text-lg font-bold text-white mb-2" id="message-title">Aviso</h3>
            <p class="text-gray-300 text-sm mb-6" id="message-text">Mensagem aqui</p>
            <div class="flex justify-end">
                <button onclick="document.getElementById('message-box').classList.add('hide')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-semibold text-white">OK</button>
            </div>
        </div>
    </div>

    <!-- MODAL: GERENCIAR ESTANTES -->
    <div id="shelf-manager-modal" class="fixed inset-0 bg-black/80 z-[90] flex items-center justify-center hide">
        <div class="bg-gray-800 p-6 rounded-lg max-w-sm w-full mx-4 shadow-xl border border-gray-700">
            <h3 class="text-lg font-bold text-white mb-4">Gerenciar Estantes</h3>
            <ul id="shelf-list" class="space-y-2 mb-4 max-h-48 overflow-y-auto"></ul>
            <div class="flex gap-2 mb-6">
                <input type="text" id="new-shelf-name" placeholder="Nova estante" class="flex-1 bg-gray-700 text-white px-3 py-2 rounded outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="ShelvesManager.add()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded font-bold text-white">+</button>
            </div>
            <div class="flex justify-end">
                <button onclick="ShelvesManager.close()" class="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded text-white font-semibold">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: OPÇÕES DO QUADRINHO -->
    <div id="comic-options-modal" class="fixed inset-0 bg-black/80 z-[90] flex items-center justify-center hide">
        <div class="bg-gray-800 p-6 rounded-lg max-w-sm w-full mx-4 shadow-xl border border-gray-700">
            <h3 class="text-lg font-bold text-white mb-4 truncate" id="options-comic-title">Título</h3>
            <div class="mb-6">
                <label class="block text-sm text-gray-400 mb-2">Mover para a estante:</label>
                <select id="move-shelf-select" class="w-full bg-gray-700 text-white px-3 py-2 rounded outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div class="flex flex-col gap-3">
                <button onclick="ComicActions.move()" class="bg-blue-600 hover:bg-blue-500 py-2 rounded font-semibold text-white transition-colors">Salvar Alteração</button>
                <button onclick="ComicActions.delete()" class="bg-red-600 hover:bg-red-500 py-2 rounded font-semibold text-white transition-colors">Remover da Gibiteca</button>
                <button onclick="ComicActions.close()" class="bg-gray-600 hover:bg-gray-500 py-2 rounded font-semibold text-white transition-colors">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- TELA INICIAL: GIBITECA -->
    <main id="library-screen" class="flex-1 flex flex-col min-h-0 relative">
        
        <!-- Cabeçalho -->
        <header class="bg-gray-800 px-4 py-3 shadow-md flex justify-between items-center z-10 shrink-0">
            <div class="flex items-center gap-3">
                <img src="icon.svg" alt="Gibiteca Icon" class="w-8 h-8 drop-shadow-md">
                <h1 class="text-xl font-bold tracking-wider hidden sm:block">GIBITECA</h1>
            </div>
            <div class="flex gap-2 sm:gap-3 items-center">
                <button onclick="App.toggleFullScreen()" class="text-white hover:text-gray-300 transition-colors text-xl mr-1" title="Tela Cheia">⛶</button>
                <button onclick="Backup.export()" class="text-xs sm:text-sm bg-gray-700 px-3 py-1.5 rounded hover:bg-gray-600 transition-colors">Exportar</button>
                <button onclick="document.getElementById('import-file').click()" class="text-xs sm:text-sm bg-gray-700 px-3 py-1.5 rounded hover:bg-gray-600 transition-colors">Importar</button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="Backup.import(event)">
                <button id="auth-btn" class="text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded font-semibold transition-colors">Conectar Drive</button>
            </div>
        </header>

        <!-- Navegação de Estantes -->
        <nav id="shelf-nav" class="bg-gray-900 border-b border-gray-700 overflow-x-auto whitespace-nowrap px-4 py-2 flex items-center gap-6 shrink-0"></nav>

        <!-- Área da Prateleira (Scroll suave caso a tela seja muito baixa, mantendo proporção 3x3 vertical) -->
        <div class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-4">
            <div id="comics-grid" class="shelf-grid-3x3 pb-4">
                <!-- Cards gerados via JS -->
            </div>
        </div>

        <!-- Botão Flutuante (Adicionar do Drive) -->
        <button id="add-comic-btn" class="absolute bottom-14 right-5 bg-blue-600 w-12 h-12 sm:w-14 sm:h-14 rounded-full shadow-lg text-white text-3xl font-light flex items-center justify-center hover:bg-blue-500 hover:scale-105 transition-transform z-20">
            +
        </button>

        <!-- RODAPÉ DE PAGINAÇÃO (PRATELEIRAS) -->
        <div id="pagination-controls" class="bg-gray-800 border-t border-gray-700 px-4 py-2 flex justify-between items-center shrink-0 z-10">
            <!-- Botões injetados via JS -->
        </div>
    </main>

    <!-- TELA DE LEITURA -->
    <section id="reader-screen" class="fixed inset-0 bg-black z-50 hide flex flex-col">
        <div id="reader-header" class="absolute top-0 w-full p-4 flex justify-between items-start transition-opacity z-10 pointer-events-none">
            <button onclick="Reader.close()" class="text-gray-400 hover:text-white text-3xl drop-shadow-md pointer-events-auto" title="Voltar">←</button>
            <div id="reader-title" class="text-sm font-semibold truncate px-4 hidden sm:block text-gray-400 drop-shadow-md">Carregando...</div>
            <button onclick="App.toggleFullScreen()" class="text-gray-400 hover:text-white transition-colors text-2xl font-bold px-2 drop-shadow-md pointer-events-auto" title="Tela Cheia">⛶</button>
        </div>

        <div id="reader-container" class="flex-1 w-full h-full flex items-center justify-center relative">
            <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-black hide z-20">
                <div class="flex flex-col items-center p-4">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
                    <span id="loading-text" class="text-white text-sm text-center">Iniciando...</span>
                </div>
            </div>
            <img id="comic-page" src="" alt="Página" class="max-w-full max-h-full object-contain pointer-events-none hide">
        </div>
        
        <div class="absolute bottom-0 w-full z-10 pointer-events-none">
            <div class="flex justify-end px-2 pb-1">
                <div id="reader-progress-text" class="text-[10px] sm:text-xs text-gray-400 bg-black/60 px-2 py-0.5 rounded backdrop-blur-sm drop-shadow-md pointer-events-auto">0 / 0</div>
            </div>
            <div class="w-full h-1 bg-gray-800/50">
                <div id="reader-progress-bar" class="h-full bg-blue-500" style="width: 0%"></div>
            </div>
        </div>
    </section>

    <!-- LÓGICA DA APLICAÇÃO -->
    <script>
        /**
         * CONFIGURAÇÕES DO GOOGLE
         * ATENÇÃO: SUBSTITUA PELAS SUAS CHAVES ANTES DE SALVAR NO GITHUB
         */
        const GOOGLE_CONFIG = {
            CLIENT_ID: '1073647170468-alkgv60idbapacpttvikj6r6pejlsaod.apps.googleusercontent.com',
            API_KEY: 'AIzaSyA15zge-yfoUmQFPnbOZK98qxYOb0n4Q8E',
            APP_ID: '1073647170468',
            SCOPES: 'https://www.googleapis.com/auth/drive.readonly'
        };

        // Estado Global
        const App = {
            shelves: JSON.parse(localStorage.getItem('gibiteca_shelves')) || ['Marvel', 'DC', 'Vertigo', 'Mangás'],
            currentShelf: '',
            currentPage: 1,
            comics: [],
            
            saveShelves() {
                localStorage.setItem('gibiteca_shelves', JSON.stringify(this.shelves));
            },

            showMessage(title, text) {
                document.getElementById('message-title').innerText = title;
                document.getElementById('message-text').innerText = text;
                document.getElementById('message-box').classList.remove('hide');
            },

            toggleFullScreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.error(err));
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            }
        };

        App.currentShelf = App.shelves.length > 0 ? App.shelves[0] : '';

        // Banco de Dados (IndexedDB)
        const DB = {
            db: null,
            init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('GibitecaDB', 1);
                    request.onupgradeneeded = (e) => {
                        this.db = e.target.result;
                        if (!this.db.objectStoreNames.contains('comics')) {
                            this.db.createObjectStore('comics', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => { this.db = e.target.result; resolve(); };
                    request.onerror = () => reject('Erro no IndexedDB');
                });
            },
            async saveComic(comicData) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('comics', 'readwrite');
                    const store = tx.objectStore('comics');
                    store.put(comicData);
                    tx.oncomplete = resolve; tx.onerror = reject;
                });
            },
            async getAllComics() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('comics', 'readonly');
                    const store = tx.objectStore('comics');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result); request.onerror = reject;
                });
            },
            async getComic(id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('comics', 'readonly');
                    const store = tx.objectStore('comics');
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result); request.onerror = reject;
                });
            },
            async deleteComic(id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('comics', 'readwrite');
                    const store = tx.objectStore('comics');
                    const request = store.delete(id);
                    request.onsuccess = resolve; request.onerror = reject;
                });
            }
        };

        // Gerenciador de Estantes
        const ShelvesManager = {
            open() { this.render(); document.getElementById('shelf-manager-modal').classList.remove('hide'); },
            close() { document.getElementById('shelf-manager-modal').classList.add('hide'); },
            render() {
                const list = document.getElementById('shelf-list');
                list.innerHTML = '';
                App.shelves.forEach(shelf => {
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center bg-gray-700 p-3 rounded shadow-sm';
                    li.innerHTML = `
                        <span class="text-white font-medium truncate flex-1 mr-2">${shelf}</span>
                        <div class="flex gap-4">
                            <button onclick="ShelvesManager.rename('${shelf}')" class="text-blue-400 hover:text-blue-300">✏️</button>
                            <button onclick="ShelvesManager.remove('${shelf}')" class="text-red-400 hover:text-red-300">🗑️</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            },
            add() {
                const input = document.getElementById('new-shelf-name');
                const name = input.value.trim();
                if (name && !App.shelves.includes(name)) {
                    App.shelves.push(name);
                    App.saveShelves();
                    if (!App.currentShelf) App.currentShelf = name;
                    input.value = '';
                    this.render(); UI.renderShelves();
                }
            },
            async rename(oldName) {
                const newName = prompt('Novo nome da estante:', oldName);
                if (newName && newName.trim() !== '' && newName !== oldName && !App.shelves.includes(newName)) {
                    const index = App.shelves.indexOf(oldName);
                    App.shelves[index] = newName.trim();
                    App.saveShelves();
                    
                    const comics = await DB.getAllComics();
                    for (let c of comics) {
                        if (c.shelf === oldName) {
                            c.shelf = newName.trim();
                            await DB.saveComic(c);
                        }
                    }
                    
                    if (App.currentShelf === oldName) App.currentShelf = newName.trim();
                    this.render(); UI.renderShelves(); UI.loadComics();
                }
            },
            async remove(name) {
                if (App.shelves.length <= 1) return App.showMessage('Aviso', 'Você precisa ter pelo menos uma estante.');
                if (confirm(`Excluir a estante "${name}"? Os quadrinhos serão movidos para a estante principal.`)) {
                    App.shelves = App.shelves.filter(s => s !== name);
                    App.saveShelves();
                    const fallbackShelf = App.shelves[0];
                    const comics = await DB.getAllComics();
                    for (let c of comics) {
                        if (c.shelf === name) {
                            c.shelf = fallbackShelf;
                            await DB.saveComic(c);
                        }
                    }
                    if (App.currentShelf === name) App.currentShelf = fallbackShelf;
                    this.render(); UI.renderShelves(); UI.loadComics();
                }
            }
        };

        // Ações do Quadrinho
        const ComicActions = {
            currentId: null,
            async open(id) {
                this.currentId = id;
                const comic = await DB.getComic(id);
                document.getElementById('options-comic-title').innerText = comic.name.replace(/\.cbz|\.cbr|\.zip|\.rar/gi, '');
                const select = document.getElementById('move-shelf-select');
                select.innerHTML = '';
                App.shelves.forEach(shelf => {
                    const opt = document.createElement('option');
                    opt.value = shelf; opt.innerText = shelf;
                    if (shelf === comic.shelf) opt.selected = true;
                    select.appendChild(opt);
                });
                document.getElementById('comic-options-modal').classList.remove('hide');
            },
            close() { document.getElementById('comic-options-modal').classList.add('hide'); this.currentId = null; },
            async move() {
                if (!this.currentId) return;
                const newShelf = document.getElementById('move-shelf-select').value;
                const comic = await DB.getComic(this.currentId);
                if (comic) { comic.shelf = newShelf; await DB.saveComic(comic); }
                this.close(); UI.loadComics();
            },
            async delete() {
                if (!this.currentId) return;
                if (confirm('Remover este quadrinho da sua Gibiteca?')) {
                    await DB.deleteComic(this.currentId);
                    this.close(); UI.loadComics();
                }
            }
        };

        // Integração Google Drive
        const Drive = {
            tokenClient: null, accessToken: null,
            init() {
                if (GOOGLE_CONFIG.CLIENT_ID.includes('COLE_SEU')) return console.warn("CLIENT_ID não configurado.");
                gapi.load('client:picker', async () => {
                    await gapi.client.init({
                        apiKey: GOOGLE_CONFIG.API_KEY,
                        discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
                    });
                });
                this.tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CONFIG.CLIENT_ID,
                    scope: GOOGLE_CONFIG.SCOPES,
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            this.accessToken = tokenResponse.access_token;
                            gapi.client.setToken({ access_token: this.accessToken });
                            document.getElementById('auth-btn').innerText = 'Conectado';
                            document.getElementById('auth-btn').classList.replace('bg-blue-600', 'bg-green-600');
                        }
                    },
                });
                document.getElementById('auth-btn').onclick = () => this.login();
                document.getElementById('add-comic-btn').onclick = () => this.openPicker();
            },
            login() { this.tokenClient.requestAccessToken({ prompt: 'consent' }); },
            openPicker() {
                if (!this.accessToken) {
                    App.showMessage('Autenticação Necessária', 'Conecte-se ao Drive primeiro.');
                    return this.login();
                }
                const view = new google.picker.DocsView(google.picker.ViewId.DOCS);
                view.setIncludeFolders(true); 
                const picker = new google.picker.PickerBuilder()
                    .addView(view).setOAuthToken(this.accessToken).setDeveloperKey(GOOGLE_CONFIG.API_KEY)
                    .setCallback(this.pickerCallback.bind(this)).build();
                picker.setVisible(true);
            },
            async pickerCallback(data) {
                if (data.action === google.picker.Action.PICKED) {
                    await this.processNewComic(data.docs[0]);
                }
            },
            async processNewComic(driveDoc) {
                if (!App.currentShelf) return App.showMessage('Aviso', 'Crie uma estante antes.');
                const comicData = {
                    id: driveDoc.id, name: driveDoc.name, shelf: App.currentShelf,
                    currentPage: 1, totalPages: 0, progress: 0, coverBlob: null 
                };
                try {
                    const fileMeta = await gapi.client.drive.files.get({ fileId: driveDoc.id, fields: 'parents' });
                    if (fileMeta.result.parents && fileMeta.result.parents.length > 0) {
                        const baseName = driveDoc.name.substring(0, driveDoc.name.lastIndexOf('.'));
                        const response = await gapi.client.drive.files.list({
                            q: `(name='${baseName}.jpg' or name='${baseName}.png' or name='${baseName}.jpeg') and '${fileMeta.result.parents[0]}' in parents`,
                            fields: 'files(id, name)'
                        });
                        if (response.result.files && response.result.files.length > 0) {
                            const coverRes = await fetch(`https://www.googleapis.com/drive/v3/files/${response.result.files[0].id}?alt=media`, {
                                headers: { 'Authorization': `Bearer ${this.accessToken}` }
                            });
                            const coverBuffer = await coverRes.arrayBuffer();
                            let binary = '';
                            const bytes = new Uint8Array(coverBuffer);
                            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                            const mimeType = response.result.files[0].name.toLowerCase().endsWith('png') ? 'image/png' : 'image/jpeg';
                            comicData.coverBlob = `data:${mimeType};base64,${btoa(binary)}`;
                        } else comicData.coverBlob = 'placeholder';
                    } else comicData.coverBlob = 'placeholder';
                } catch (error) { comicData.coverBlob = 'placeholder'; }

                await DB.saveComic(comicData);
                await UI.loadComics();
            },
            async downloadFile(fileId) {
                const response = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { 'Authorization': `Bearer ${this.accessToken}` }
                });
                if (!response.ok) throw new Error('Falha no download.');
                return await response.arrayBuffer();
            }
        };

        // Leitor de Quadrinhos
        const Reader = {
            currentComicId: null, pages: [], currentIndex: 0, hammer: null,
            scale: 1, lastScale: 1, translateX: 0, translateY: 0, lastTranslateX: 0, lastTranslateY: 0,
            async open(comicId) {
                this.currentComicId = comicId;
                const comic = await DB.getComic(comicId);
                const loadingText = document.getElementById('loading-text');
                
                document.getElementById('library-screen').classList.add('hide');
                document.getElementById('reader-screen').classList.remove('hide');
                document.getElementById('reader-title').innerText = comic.name;
                document.getElementById('loading-spinner').classList.remove('hide');
                document.getElementById('comic-page').classList.add('hide');

                this.setupGestures();

                try {
                    if (comic.name.toLowerCase().endsWith('.cbr') || comic.name.toLowerCase().endsWith('.rar')) {
                        App.showMessage('Formato Não Suportado', 'Converta para .cbz (ZIP) antes de ler.');
                        return this.close();
                    }
                    loadingText.innerText = 'Baixando...';
                    const buffer = await Drive.downloadFile(comic.id);
                    loadingText.innerText = 'Descompactando...';
                    const zip = await JSZip.loadAsync(buffer);
                    loadingText.innerText = 'Preparando páginas...';
                    const imageFiles = Object.keys(zip.files).filter(name => name.match(/\.(jpg|jpeg|png|gif|webp)$/i));
                    imageFiles.sort(); 

                    this.pages = [];
                    for (const filename of imageFiles) {
                        const fileData = await zip.files[filename].async("blob");
                        this.pages.push(URL.createObjectURL(fileData)); 
                    }
                    if (this.pages.length === 0) {
                        App.showMessage('Arquivo Vazio', 'Não foram encontradas imagens.');
                        return this.close();
                    }
                    comic.totalPages = this.pages.length;
                    this.currentIndex = comic.currentPage > 0 ? comic.currentPage - 1 : 0;
                    
                    document.getElementById('loading-spinner').classList.add('hide');
                    document.getElementById('comic-page').classList.remove('hide');
                    this.renderPage();
                } catch (error) {
                    App.showMessage('Erro de Leitura', 'Erro ao carregar arquivo. Verifique sua conexão com o Drive.');
                    this.close();
                }
            },
            renderPage() {
                const img = document.getElementById('comic-page');
                img.src = this.pages[this.currentIndex];
                this.resetZoom();
                const current = this.currentIndex + 1;
                const total = this.pages.length;
                document.getElementById('reader-progress-text').innerText = `${current} / ${total}`;
                document.getElementById('reader-progress-bar').style.width = `${(current / total) * 100}%`;
                this.saveProgress(current, total);
            },
            async saveProgress(current, total) {
                const comic = await DB.getComic(this.currentComicId);
                if (comic) {
                    comic.currentPage = current; comic.totalPages = total;
                    comic.progress = Math.round((current / total) * 100);
                    await DB.saveComic(comic);
                }
            },
            close() {
                if (this.pages.length > 0) { this.pages.forEach(url => URL.revokeObjectURL(url)); this.pages = []; }
                document.getElementById('reader-screen').classList.add('hide');
                document.getElementById('library-screen').classList.remove('hide');
                UI.loadComics(); 
            },
            setupGestures() {
                if (this.hammer) return; 
                const container = document.getElementById('reader-container');
                const img = document.getElementById('comic-page');
                this.hammer = new Hammer(container);
                this.hammer.get('pinch').set({ enable: true });
                this.hammer.get('pan').set({ direction: Hammer.DIRECTION_ALL });

                this.hammer.on('swipeleft', () => { if (this.scale === 1 && this.currentIndex < this.pages.length - 1) { this.currentIndex++; this.renderPage(); }});
                this.hammer.on('swiperight', () => { if (this.scale === 1 && this.currentIndex > 0) { this.currentIndex--; this.renderPage(); }});
                this.hammer.on('pinchstart', () => { this.lastScale = this.scale; });
                this.hammer.on('pinch', (e) => { this.scale = Math.max(1, Math.min(this.lastScale * e.scale, 4)); this.applyTransform(img); });
                this.hammer.on('panstart', () => { this.lastTranslateX = this.translateX; this.lastTranslateY = this.translateY; });
                this.hammer.on('pan', (e) => { if (this.scale > 1) { this.translateX = this.lastTranslateX + e.deltaX; this.translateY = this.lastTranslateY + e.deltaY; this.applyTransform(img); }});
                this.hammer.on('doubletap', () => { if (this.scale > 1) this.resetZoom(); else { this.scale = 2; this.applyTransform(img); }});
            },
            applyTransform(el) { el.style.transform = `translate(${this.translateX}px, ${this.translateY}px) scale(${this.scale})`; },
            resetZoom() {
                this.scale = 1; this.lastScale = 1; this.translateX = 0; this.translateY = 0;
                this.lastTranslateX = 0; this.lastTranslateY = 0; this.applyTransform(document.getElementById('comic-page'));
            }
        };

        // Backup (Exportar / Importar)
        const Backup = {
            async export() {
                const comics = await DB.getAllComics();
                const exportData = comics.map(c => ({
                    id: c.id, name: c.name, shelf: c.shelf, currentPage: c.currentPage,
                    totalPages: c.totalPages, progress: c.progress, coverBlob: c.coverBlob
                }));
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
                const anchor = document.createElement('a');
                anchor.setAttribute("href", dataStr); anchor.setAttribute("download", `gibiteca_backup.json`);
                document.body.appendChild(anchor); anchor.click(); anchor.remove();
            },
            async import(event) {
                const file = event.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const importedComics = JSON.parse(e.target.result);
                        for (const comic of importedComics) {
                            if (!App.shelves.includes(comic.shelf)) App.shelves.push(comic.shelf);
                            const existing = await DB.getComic(comic.id);
                            if (existing) {
                                existing.currentPage = comic.currentPage; existing.progress = comic.progress;
                                existing.shelf = comic.shelf; await DB.saveComic(existing);
                            } else await DB.saveComic(comic);
                        }
                        App.saveShelves(); App.showMessage('Sucesso', 'Backup restaurado com sucesso!');
                        UI.renderShelves(); UI.loadComics();
                    } catch (err) { App.showMessage('Erro', 'Falha ao ler o arquivo de backup.'); }
                };
                reader.readAsText(file);
            }
        };

        // Interface e Renderização (3x3 por Prateleira)
        const UI = {
            renderShelves() {
                const nav = document.getElementById('shelf-nav');
                nav.innerHTML = ''; 
                App.shelves.forEach(shelf => {
                    const btn = document.createElement('button');
                    const isActive = (shelf === App.currentShelf);
                    btn.className = `shelf-tab font-bold pb-1 transition-colors ${isActive ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400 hover:text-gray-200'}`;
                    btn.innerText = shelf;
                    btn.onclick = () => this.changeShelf(shelf);
                    nav.appendChild(btn);
                });
                const manageBtn = document.createElement('button');
                manageBtn.className = 'text-gray-500 hover:text-gray-300 ml-4 transition-colors font-bold flex items-center justify-center shrink-0';
                manageBtn.title = 'Gerenciar Estantes';
                manageBtn.innerHTML = '⚙️';
                manageBtn.onclick = () => ShelvesManager.open();
                nav.appendChild(manageBtn);
            },
            
            changeShelf(shelfName) {
                App.currentShelf = shelfName;
                App.currentPage = 1;
                this.renderShelves(); 
                this.renderGrid();
            },
            
            changePage(direction) {
                App.currentPage += direction;
                this.renderGrid();
            },

            async loadComics() {
                const comics = await DB.getAllComics();
                comics.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
                App.comics = comics;
                this.renderGrid();
            },

            renderGrid() {
                const grid = document.getElementById('comics-grid');
                grid.innerHTML = ''; 

                const filtered = App.comics.filter(c => c.shelf === App.currentShelf);

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-3 text-center text-gray-500 mt-10 flex flex-col items-center">
                        <span class="text-4xl mb-4">🗂️</span>
                        A estante "${App.currentShelf}" está vazia.
                    </div>`;
                    this.renderPagination(1, 0);
                    return;
                }

                // 3 COLUNAS x 3 LINHAS = 9 REVISTAS POR PRATELEIRA
                const ITEMS_PER_PAGE = 9;
                const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
                
                if (App.currentPage > totalPages) App.currentPage = totalPages;
                if (App.currentPage < 1) App.currentPage = 1;

                const startIndex = (App.currentPage - 1) * ITEMS_PER_PAGE;
                const paginatedComics = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

                paginatedComics.forEach(comic => {
                    const coverSrc = comic.coverBlob && comic.coverBlob !== 'placeholder' 
                        ? comic.coverBlob 
                        : 'https://via.placeholder.com/300x450/374151/9CA3AF?text=Sem+Capa';
                    
                    const cleanTitle = comic.name.replace(/\.cbz|\.cbr|\.zip|\.rar/gi, '');
                    const progressVal = comic.progress || 0;

                    const card = document.createElement('div');
                    card.className = 'comic-card group';
                    card.onclick = () => Reader.open(comic.id);
                    card.innerHTML = `
                        <div class="absolute top-1.5 right-1.5 z-20 opacity-80 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                            <button onclick="event.stopPropagation(); ComicActions.open('${comic.id}')" class="bg-black/75 text-white rounded-full w-7 h-7 flex items-center justify-center hover:bg-black font-bold text-sm shadow">⋮</button>
                        </div>
                        <div class="comic-cover-box">
                            <img src="${coverSrc}" alt="Capa ${cleanTitle}">
                        </div>
                        <div class="comic-meta-box">
                            <h3 class="text-xs font-bold text-gray-100 truncate leading-tight" title="${cleanTitle}">${cleanTitle}</h3>
                            <div class="w-full">
                                <div class="h-1.5 w-full bg-gray-700 rounded-full overflow-hidden">
                                    <div class="h-full bg-blue-500" style="width: ${progressVal}%"></div>
                                </div>
                                <p class="text-[10px] text-gray-400 mt-1 text-right leading-none">${progressVal}%</p>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                this.renderPagination(totalPages, filtered.length);
            },

            renderPagination(totalPages, totalItems) {
                const ctr = document.getElementById('pagination-controls');
                
                const btnPrev = App.currentPage <= 1 
                    ? `<button disabled class="text-gray-600 cursor-not-allowed font-bold text-xs sm:text-sm px-2 py-1">&laquo; Anterior</button>`
                    : `<button onclick="UI.changePage(-1)" class="text-blue-400 hover:text-blue-300 font-bold text-xs sm:text-sm px-2 py-1">&laquo; Anterior</button>`;
                
                const btnNext = App.currentPage >= totalPages 
                    ? `<button disabled class="text-gray-600 cursor-not-allowed font-bold text-xs sm:text-sm px-2 py-1">Próxima &raquo;</button>`
                    : `<button onclick="UI.changePage(1)" class="text-blue-400 hover:text-blue-300 font-bold text-xs sm:text-sm px-2 py-1">Próxima &raquo;</button>`;

                ctr.innerHTML = `
                    ${btnPrev}
                    <span class="text-gray-300 text-xs sm:text-sm font-medium tracking-wide">
                        Prateleira ${App.currentPage} de ${totalPages} <span class="text-gray-500 text-xs">(${totalItems} HQs)</span>
                    </span>
                    ${btnNext}
                `;
            }
        };

        window.onload = async () => {
            await DB.init();
            UI.renderShelves();
            UI.loadComics();
            setTimeout(() => { Drive.init(); }, 1000); 
        };
    </script>
</body>
</html>
