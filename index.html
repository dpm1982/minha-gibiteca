<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Gibiteca PWA</title>
    
    <!-- Meta tags para PWA (Tela cheia no Android/iOS) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111827">

    <!-- Configuração PWA (Manifesto e Ícone SVG) -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">

    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <!-- APIs do Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <style>
        /* Estilos personalizados essenciais que o Tailwind não cobre nativamente */
        body {
            overscroll-behavior-y: none; /* Previne o 'pull-to-refresh' no Android */
            background-color: #111827;
            color: #f3f4f6;
        }
        
        /* Oculta barras de rolagem para uma experiência mais limpa */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }

        /* Estilos do Leitor */
        #reader-container {
            touch-action: none; /* CRUCIAL para o Hammer.js funcionar sem conflito com o scroll do navegador */
            overflow: hidden;
        }
        
        #comic-page {
            transition: transform 0.1s ease-out; /* Suaviza o zoom/pan */
            transform-origin: center center;
            will-change: transform;
        }

        .hide { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col font-sans overflow-hidden">

    <!-- CAIXA DE MENSAGEM CUSTOMIZADA -->
    <div id="message-box" class="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center hide">
        <div class="bg-gray-800 p-6 rounded-lg max-w-sm w-full mx-4 shadow-xl border border-gray-700">
            <h3 class="text-lg font-bold text-white mb-2" id="message-title">Aviso</h3>
            <p class="text-gray-300 text-sm mb-6" id="message-text">Mensagem aqui</p>
            <div class="flex justify-end">
                <button onclick="document.getElementById('message-box').classList.add('hide')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-semibold text-white">OK</button>
            </div>
        </div>
    </div>

    <!-- AVISO DE CONFIGURAÇÃO -->
    <div id="config-warning" class="bg-yellow-600 text-white p-3 text-sm text-center hide">
        Atenção: Configure seu CLIENT_ID e API_KEY no código para usar o Google Drive real. 
        <button onclick="App.loadMockData()" class="ml-4 underline font-bold">Usar Dados de Teste</button>
    </div>

    <!-- TELA INICIAL: GIBITECA -->
    <main id="library-screen" class="flex-1 flex flex-col h-full">
        <!-- Cabeçalho -->
        <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center z-10">
            <h1 class="text-xl font-bold tracking-wider">GIBITECA</h1>
            <div class="flex gap-4">
                <button onclick="Backup.export()" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">Exportar Backup</button>
                <button onclick="document.getElementById('import-file').click()" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">Importar</button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="Backup.import(event)">
                <button id="auth-btn" class="bg-blue-600 hover:bg-blue-500 px-4 py-1 rounded font-semibold transition-colors">Conectar Drive</button>
            </div>
        </header>

        <!-- Navegação de Estantes (Tabs) -->
        <nav class="bg-gray-900 border-b border-gray-700 overflow-x-auto whitespace-nowrap px-4 py-2 flex gap-6">
            <button class="shelf-tab text-blue-400 font-bold border-b-2 border-blue-400 pb-1" onclick="UI.changeShelf('Marvel')">Marvel</button>
            <button class="shelf-tab text-gray-400 font-bold hover:text-gray-200 pb-1" onclick="UI.changeShelf('DC')">DC</button>
            <button class="shelf-tab text-gray-400 font-bold hover:text-gray-200 pb-1" onclick="UI.changeShelf('Vertigo')">Vertigo</button>
            <button class="shelf-tab text-gray-400 font-bold hover:text-gray-200 pb-1" onclick="UI.changeShelf('Mangas')">Mangás</button>
        </nav>

        <!-- Grid de Quadrinhos -->
        <div id="comics-grid" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Cards gerados via JavaScript -->
        </div>

        <!-- Botão Flutuante (Adicionar do Drive) -->
        <button id="add-comic-btn" class="fixed bottom-6 right-6 bg-blue-600 w-14 h-14 rounded-full shadow-lg text-white text-3xl font-light flex items-center justify-center hover:bg-blue-500 hover:scale-105 transition-transform z-20">
            +
        </button>
    </main>

    <!-- TELA DE LEITURA (Oculta por padrão) -->
    <section id="reader-screen" class="fixed inset-0 bg-black z-50 hide flex flex-col">
        <!-- Controles Superiores do Leitor -->
        <div id="reader-header" class="absolute top-0 w-full bg-gradient-to-b from-black/80 to-transparent p-4 flex justify-between items-center transition-opacity z-10">
            <button onclick="Reader.close()" class="text-white bg-gray-800/80 px-4 py-2 rounded-lg backdrop-blur-sm">← Voltar</button>
            <div id="reader-title" class="text-sm font-semibold truncate px-4">Carregando...</div>
            <div id="reader-progress-text" class="text-xs bg-gray-800/80 px-3 py-1 rounded-full">0 / 0</div>
        </div>

        <!-- Container da Imagem (Onde o Hammer.js atua) -->
        <div id="reader-container" class="flex-1 w-full h-full flex items-center justify-center relative">
            <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-black hide z-20">
                <div class="flex flex-col items-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
                    <span id="loading-text" class="text-white text-sm text-center">Iniciando...</span>
                </div>
            </div>
            <!-- Imagem base do quadrinho -->
            <img id="comic-page" src="" alt="Página" class="max-w-full max-h-full object-contain pointer-events-none hide">
        </div>
        
        <!-- Barra de Progresso Inferior -->
        <div class="absolute bottom-0 w-full h-1 bg-gray-800">
            <div id="reader-progress-bar" class="h-full bg-blue-500" style="width: 0%"></div>
        </div>
    </section>

    <!-- LÓGICA DA APLICAÇÃO -->
    <script>
        /**
         * CONFIGURAÇÕES DO GOOGLE
         */
        const GOOGLE_CONFIG = {
            CLIENT_ID: '1073647170468-alkgv60idbapacpttvikj6r6pejlsaod.apps.googleusercontent.com',
            API_KEY: 'AIzaSyA15zge-yfoUmQFPnbOZK98qxYOb0n4Q8E',
            APP_ID: '1073647170468',
            // MUDANÇA IMPORTANTE: Escopo alterado para leitura total para podermos enxergar o arquivo da capa!
            SCOPES: 'https://www.googleapis.com/auth/drive.readonly'
        };

        // Estado Global da Aplicação
        const App = {
            currentShelf: 'Marvel',
            comics: [],
            isMockMode: false,
            
            showMessage(title, text) {
                document.getElementById('message-title').innerText = title;
                document.getElementById('message-text').innerText = text;
                document.getElementById('message-box').classList.remove('hide');
            }
        };

        /**
         * 1. LÓGICA DE DADOS (IndexedDB)
         */
        const DB = {
            db: null,
            init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('GibitecaDB', 1);
                    
                    request.onupgradeneeded = (e) => {
                        this.db = e.target.result;
                        if (!this.db.objectStoreNames.contains('comics')) {
                            this.db.createObjectStore('comics', { keyPath: 'id' });
                        }
                    };
                    
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                    request.onerror = (e) => reject('Erro no IndexedDB');
                });
            },

            async saveComic(comicData) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('comics', 'readwrite');
                    const store = tx.objectStore('comics');
                    store.put(comicData);
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
            },

            async getAllComics() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('comics', 'readonly');
                    const store = tx.objectStore('comics');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = reject;
                });
            },

            async getComic(id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('comics', 'readonly');
                    const store = tx.objectStore('comics');
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = reject;
                });
            }
        };

        /**
         * 2. LÓGICA DO GOOGLE DRIVE (Autenticação e API)
         */
        const Drive = {
            tokenClient: null,
            accessToken: null,

            init() {
                if (GOOGLE_CONFIG.CLIENT_ID.includes('COLE_SEU')) {
                    document.getElementById('config-warning').classList.remove('hide');
                    return; 
                }

                gapi.load('client:picker', async () => {
                    await gapi.client.init({
                        apiKey: GOOGLE_CONFIG.API_KEY,
                        discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
                    });
                });

                this.tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CONFIG.CLIENT_ID,
                    scope: GOOGLE_CONFIG.SCOPES,
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            this.accessToken = tokenResponse.access_token;
                            gapi.client.setToken({ access_token: this.accessToken });
                            
                            document.getElementById('auth-btn').innerText = 'Conectado';
                            document.getElementById('auth-btn').classList.replace('bg-blue-600', 'bg-green-600');
                        }
                    },
                });

                document.getElementById('auth-btn').onclick = () => this.login();
                document.getElementById('add-comic-btn').onclick = () => this.openPicker();
            },

            login() {
                this.tokenClient.requestAccessToken({ prompt: 'consent' });
            },

            openPicker() {
                if (!this.accessToken) {
                    App.showMessage('Autenticação Necessária', 'Por favor, conecte-se ao Drive primeiro.');
                    this.login();
                    return;
                }

                const view = new google.picker.DocsView(google.picker.ViewId.DOCS);
                // Permitindo ver pastas para achar qualquer arquivo que o Google possa ter classificado errado
                view.setIncludeFolders(true); 
                
                const picker = new google.picker.PickerBuilder()
                    .addView(view)
                    .setOAuthToken(this.accessToken)
                    .setDeveloperKey(GOOGLE_CONFIG.API_KEY)
                    .setCallback(this.pickerCallback.bind(this))
                    .build();
                picker.setVisible(true);
            },

            async pickerCallback(data) {
                if (data.action === google.picker.Action.PICKED) {
                    const doc = data.docs[0];
                    await this.processNewComic(doc);
                }
            },

            // Lógica Central: Sidecar Cover
            async processNewComic(driveDoc) {
                const fileId = driveDoc.id;
                const fileName = driveDoc.name;

                const comicData = {
                    id: fileId,
                    name: fileName,
                    shelf: App.currentShelf,
                    currentPage: 1,
                    totalPages: 0,
                    progress: 0,
                    coverBlob: null 
                };

                try {
                    // Passo 1: Como o Picker nem sempre retorna a pasta pai correta, consultamos explicitamente a API
                    const fileMeta = await gapi.client.drive.files.get({
                        fileId: fileId,
                        fields: 'parents'
                    });

                    if (fileMeta.result.parents && fileMeta.result.parents.length > 0) {
                        const parentId = fileMeta.result.parents[0];
                        const baseName = fileName.substring(0, fileName.lastIndexOf('.'));
                        
                        // Passo 2: Busca na mesma pasta por arquivos com o exato mesmo nome + extensão de imagem
                        const response = await gapi.client.drive.files.list({
                            q: `(name='${baseName}.jpg' or name='${baseName}.png' or name='${baseName}.jpeg') and '${parentId}' in parents`,
                            fields: 'files(id, name)'
                        });

                        if (response.result.files && response.result.files.length > 0) {
                            const coverId = response.result.files[0].id;
                            
                            // Passo 3: Download direto em binário via Fetch (Evita que o gapi corrompa os dados da imagem)
                            const coverRes = await fetch(`https://www.googleapis.com/drive/v3/files/${coverId}?alt=media`, {
                                headers: { 'Authorization': `Bearer ${this.accessToken}` }
                            });
                            const coverBuffer = await coverRes.arrayBuffer();
                            
                            // Converte o binário para Base64 de forma segura sem estourar a memória
                            let binary = '';
                            const bytes = new Uint8Array(coverBuffer);
                            for (let i = 0; i < bytes.byteLength; i++) {
                                binary += String.fromCharCode(bytes[i]);
                            }
                            
                            const mimeType = response.result.files[0].name.toLowerCase().endsWith('png') ? 'image/png' : 'image/jpeg';
                            comicData.coverBlob = `data:${mimeType};base64,${btoa(binary)}`;
                        } else {
                            comicData.coverBlob = 'placeholder'; 
                        }
                    } else {
                        comicData.coverBlob = 'placeholder';
                    }
                } catch (error) {
                    console.error("Erro ao buscar sidecar:", error);
                    comicData.coverBlob = 'placeholder';
                }

                await DB.saveComic(comicData);
                await UI.loadComics();
            },

            async downloadFile(fileId) {
                // Faz o download do arquivo compactado pesado em modo binário
                const response = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { 'Authorization': `Bearer ${this.accessToken}` }
                });
                
                if (!response.ok) {
                    throw new Error('Falha no download da API do Drive.');
                }
                
                return await response.arrayBuffer();
            }
        };

        /**
         * 3. LÓGICA DE LEITURA E TOUCH (JSZip + Hammer.js)
         */
        const Reader = {
            currentComicId: null,
            pages: [], 
            currentIndex: 0,
            
            hammer: null,
            scale: 1,
            lastScale: 1,
            translateX: 0,
            translateY: 0,
            lastTranslateX: 0,
            lastTranslateY: 0,

            async open(comicId) {
                this.currentComicId = comicId;
                const comic = await DB.getComic(comicId);
                const loadingText = document.getElementById('loading-text');
                
                document.getElementById('library-screen').classList.add('hide');
                document.getElementById('reader-screen').classList.remove('hide');
                document.getElementById('reader-title').innerText = comic.name;
                document.getElementById('loading-spinner').classList.remove('hide');
                document.getElementById('comic-page').classList.add('hide');

                this.setupGestures();

                if (App.isMockMode) {
                    this.mockExtract(comic);
                } else {
                    try {
                        if (comic.name.toLowerCase().endsWith('.cbr') || comic.name.toLowerCase().endsWith('.rar')) {
                            App.showMessage('Formato Não Suportado', 'Aviso: Formatos .cbr/.rar não podem ser abertos levemente no navegador. Por favor, recompacte suas revistas para formato .zip e renomeie para .cbz.');
                            this.close();
                            return;
                        }

                        // Informa ao usuário que começou a baixar (Pode demorar por ser grande)
                        loadingText.innerText = 'Baixando do Drive (Isso pode demorar alguns minutos)...';
                        const buffer = await Drive.downloadFile(comic.id);
                        
                        // Informa que começou a descompactar na memória do tablet
                        loadingText.innerText = 'Descompactando imagens da revista...';
                        const zip = await JSZip.loadAsync(buffer);
                        
                        loadingText.innerText = 'Preparando páginas para leitura...';
                        const imageFiles = Object.keys(zip.files).filter(name => name.match(/\.(jpg|jpeg|png|gif|webp)$/i));
                        imageFiles.sort(); 

                        this.pages = [];
                        for (const filename of imageFiles) {
                            const fileData = await zip.files[filename].async("blob");
                            this.pages.push(URL.createObjectURL(fileData)); 
                        }

                        if (this.pages.length === 0) {
                            App.showMessage('Arquivo Vazio', 'O arquivo foi aberto, mas não encontramos imagens legíveis dentro dele.');
                            this.close();
                            return;
                        }

                        comic.totalPages = this.pages.length;
                        this.currentIndex = comic.currentPage > 0 ? comic.currentPage - 1 : 0;
                        
                        document.getElementById('loading-spinner').classList.add('hide');
                        document.getElementById('comic-page').classList.remove('hide');
                        
                        this.renderPage();
                    } catch (error) {
                        console.error('Erro ao abrir quadrinho:', error);
                        App.showMessage('Erro de Leitura', 'Erro ao carregar ou descompactar o arquivo. Verifique sua internet ou se o arquivo .cbz está corrompido.');
                        this.close();
                    }
                }
            },

            mockExtract(comic) {
                setTimeout(() => {
                    this.pages = Array.from({length: 10}, (_, i) => `https://picsum.photos/800/1200?random=${comic.id}${i}`);
                    comic.totalPages = this.pages.length;
                    this.currentIndex = comic.currentPage > 0 ? comic.currentPage - 1 : 0;
                    document.getElementById('loading-spinner').classList.add('hide');
                    document.getElementById('comic-page').classList.remove('hide');
                    this.renderPage();
                }, 1000);
            },

            renderPage() {
                const img = document.getElementById('comic-page');
                img.src = this.pages[this.currentIndex];
                
                this.resetZoom();

                const current = this.currentIndex + 1;
                const total = this.pages.length;
                document.getElementById('reader-progress-text').innerText = `${current} / ${total}`;
                document.getElementById('reader-progress-bar').style.width = `${(current / total) * 100}%`;

                this.saveProgress(current, total);
            },

            async saveProgress(current, total) {
                const comic = await DB.getComic(this.currentComicId);
                if (comic) {
                    comic.currentPage = current;
                    comic.totalPages = total;
                    comic.progress = Math.round((current / total) * 100);
                    await DB.saveComic(comic);
                }
            },

            close() {
                if (!App.isMockMode && this.pages.length > 0) {
                    this.pages.forEach(url => URL.revokeObjectURL(url));
                    this.pages = [];
                }

                document.getElementById('reader-screen').classList.add('hide');
                document.getElementById('library-screen').classList.remove('hide');
                UI.loadComics(); 
            },

            setupGestures() {
                if (this.hammer) return; 

                const container = document.getElementById('reader-container');
                const img = document.getElementById('comic-page');
                
                this.hammer = new Hammer(container);
                this.hammer.get('pinch').set({ enable: true });
                this.hammer.get('pan').set({ direction: Hammer.DIRECTION_ALL });

                this.hammer.on('swipeleft', () => {
                    if (this.scale === 1 && this.currentIndex < this.pages.length - 1) {
                        this.currentIndex++;
                        this.renderPage();
                    }
                });

                this.hammer.on('swiperight', () => {
                    if (this.scale === 1 && this.currentIndex > 0) {
                        this.currentIndex--;
                        this.renderPage();
                    }
                });

                this.hammer.on('pinchstart', () => { this.lastScale = this.scale; });
                this.hammer.on('pinch', (e) => {
                    this.scale = Math.max(1, Math.min(this.lastScale * e.scale, 4)); 
                    this.applyTransform(img);
                });

                this.hammer.on('panstart', () => {
                    this.lastTranslateX = this.translateX;
                    this.lastTranslateY = this.translateY;
                });
                this.hammer.on('pan', (e) => {
                    if (this.scale > 1) {
                        this.translateX = this.lastTranslateX + e.deltaX;
                        this.translateY = this.lastTranslateY + e.deltaY;
                        this.applyTransform(img);
                    }
                });

                this.hammer.on('doubletap', () => {
                    if (this.scale > 1) {
                        this.resetZoom();
                    } else {
                        this.scale = 2; 
                        this.applyTransform(img);
                    }
                });
            },

            applyTransform(el) {
                el.style.transform = `translate(${this.translateX}px, ${this.translateY}px) scale(${this.scale})`;
            },

            resetZoom() {
                this.scale = 1;
                this.lastScale = 1;
                this.translateX = 0;
                this.translateY = 0;
                this.lastTranslateX = 0;
                this.lastTranslateY = 0;
                this.applyTransform(document.getElementById('comic-page'));
            }
        };

        /**
         * 4. LÓGICA DE BACKUP E RECONCILIAÇÃO
         */
        const Backup = {
            async export() {
                const comics = await DB.getAllComics();
                const exportData = comics.map(c => ({
                    id: c.id,
                    name: c.name,
                    shelf: c.shelf,
                    currentPage: c.currentPage,
                    totalPages: c.totalPages,
                    progress: c.progress
                }));

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
                const anchor = document.createElement('a');
                anchor.setAttribute("href", dataStr);
                anchor.setAttribute("download", `gibiteca_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
            },

            async import(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const importedComics = JSON.parse(e.target.result);
                        for (const comic of importedComics) {
                            const existing = await DB.getComic(comic.id);
                            
                            if (existing) {
                                existing.currentPage = comic.currentPage;
                                existing.progress = comic.progress;
                                existing.shelf = comic.shelf;
                                await DB.saveComic(existing);
                            } else {
                                await DB.saveComic(comic);
                            }
                        }
                        App.showMessage('Sucesso', 'Backup restaurado com sucesso!');
                        UI.loadComics();
                    } catch (err) {
                        App.showMessage('Erro', 'Falha ao ler o arquivo de backup.');
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            }
        };

        /**
         * 5. LÓGICA DE INTERFACE (Renderização)
         */
        const UI = {
            async loadComics() {
                const comics = await DB.getAllComics();
                App.comics = comics;
                this.renderGrid();
            },

            changeShelf(shelfName) {
                App.currentShelf = shelfName;
                
                document.querySelectorAll('.shelf-tab').forEach(tab => {
                    if(tab.innerText === shelfName) {
                        tab.classList.replace('text-gray-400', 'text-blue-400');
                        tab.classList.add('border-b-2', 'border-blue-400');
                    } else {
                        tab.classList.replace('text-blue-400', 'text-gray-400');
                        tab.classList.remove('border-b-2', 'border-blue-400');
                    }
                });

                this.renderGrid();
            },

            renderGrid() {
                const grid = document.getElementById('comics-grid');
                grid.innerHTML = ''; 

                const filtered = App.comics.filter(c => c.shelf === App.currentShelf);

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center text-gray-500 mt-10">Estante vazia. Adicione quadrinhos pelo botão +</div>`;
                    return;
                }

                filtered.forEach(comic => {
                    const coverSrc = comic.coverBlob && comic.coverBlob !== 'placeholder' 
                                     ? comic.coverBlob 
                                     : 'https://via.placeholder.com/300x450/374151/9CA3AF?text=Sem+Capa';

                    const card = document.createElement('div');
                    card.className = 'bg-gray-800 rounded-lg overflow-hidden shadow-lg cursor-pointer transform hover:scale-105 transition-transform flex flex-col';
                    card.onclick = () => Reader.open(comic.id);
                    
                    card.innerHTML = `
                        <div class="relative pb-[150%]">
                            <img src="${coverSrc}" class="absolute top-0 left-0 w-full h-full object-cover" alt="Capa ${comic.name}">
                        </div>
                        <div class="p-2 flex-1 flex flex-col justify-between">
                            <h3 class="text-sm font-bold truncate" title="${comic.name}">${comic.name.replace(/\.cbz|\.cbr|\.zip|\.rar/gi, '')}</h3>
                            <div class="mt-2 w-full">
                                <div class="h-1.5 w-full bg-gray-700 rounded-full overflow-hidden">
                                    <div class="h-full bg-blue-500" style="width: ${comic.progress || 0}%"></div>
                                </div>
                                <p class="text-xs text-gray-400 mt-1 text-right">${comic.progress || 0}%</p>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        };

        /**
         * Inicialização da Aplicação
         */
        window.onload = async () => {
            await DB.init();
            UI.loadComics();
            
            setTimeout(() => { Drive.init(); }, 1000); 
        };

        App.loadMockData = async () => {
            App.isMockMode = true;
            document.getElementById('config-warning').classList.add('hide');
            
            const mocks = [
                { id: '1', name: 'Homem_Aranha_01.cbz', shelf: 'Marvel', progress: 45, currentPage: 5, totalPages: 11 },
                { id: '2', name: 'X-Men_Origens.cbz', shelf: 'Marvel', progress: 0, currentPage: 0, totalPages: 0 },
                { id: '3', name: 'Batman_Ano_Um.cbz', shelf: 'DC', progress: 100, currentPage: 20, totalPages: 20 }
            ];

            for (let m of mocks) {
                const exists = await DB.getComic(m.id);
                if (!exists) await DB.saveComic(m);
            }
            UI.loadComics();
        };

    </script>
</body>
</html>
